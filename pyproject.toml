[project]
name = "fastlanelabs-sdk"
version = "1.6.0"
description = "Plugin contract and app registry for FastlaneLabs deployments."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100",
    "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastlanelabs_sdk*"]

[tool.setuptools.package-data]
"fastlanelabs_sdk.registry_data" = ["*.yaml"]
